name: Refresh profile dashboard

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_profile_stats.py --output data/profile.json
      - name: Render profile artwork
        run: python3 scripts/build_card.py
      - name: Commit refreshed dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/profile.json assets README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh public profile stats'
          git push origin HEAD:main
